{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}500: Internal server error{% endblock %}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>

<body>
    <div class="text-center" style="background-color: #f6f5f4; min-height: 100vh;">
        <h1 class="display-1 pt-5" style="font-family: 'Rodchenko', sans-serif; font-weight: 300; color: #121212;">500</h1>
        <p class="lead" style="color: #555;">Internal server error.</p>
        <div class="mt-4">
            <img src="{% static 'images/cobain.png' %}" alt="404" class="img-fluid" style="max-height: 400px;">
        </div>
    </div>
</body>
</html>
